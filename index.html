<style>
  :root {
    --bg:#1e3a8a;

    --bg-deep:#172e6e;

            --line:#e2e8f0;

  }
  @media (prefers-color-scheme: dark) {

  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px;

    line-height:1.55; color:var(--fg);
    background:
      radial-gradient(900px 520px at 85% -10%, var(--bg-glow), transparent 60%),
      radial-gradient(700px 480px at -10% 110%, rgba(59,130,246,.35), transparent 60%),
      linear-gradient(160deg, var(--bg) 0%, var(--bg-deep) 100%);
    background-color:var(--bg);
  }
  .card {
    width:100%; max-width:440px;
    background:var(--card);
    border-radius:20px;
    padding:40px 28px 32px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .brand { display:inline-flex; align-items:center; gap:12px; margin-bottom:28px; }
  .brand img { width:48px; height:48px; border-radius:12px; display:block; }
  .brand span { font-size:22px; font-weight:700; letter-spacing:-.01em; }
  h1 {
    margin:0 0 12px;
    font-size:28px; line-height:1.2; font-weight:700; letter-spacing:-.02em;
    text-wrap:balance;
  }
  .lead { margin:0 auto; max-width:34ch; font-size:16px; color:var(--muted); text-wrap:balance; }
  .contact { margin-top:28px; padding-top:24px; border-top:1px solid var(--line); }
  .contact p { margin:0 0 14px; font-size:14px; font-weight:500; color:var(--muted); }
  .btn {
    display:flex; align-items:center; justify-content:center; gap:10px;
    min-height:52px; padding:0 20px;
    border-radius:12px;
    background:var(--primary); color:#fff;
    font-size:16px; font-weight:600; text-decoration:none;
    transition:background-color .15s ease, transform .15s ease;
  }
  .btn:hover { background:var(--primary-hover); }
  .btn:active { transform:scale(.98); }
  .btn:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  .btn svg { width:22px; height:22px; flex:none; }
  @media (max-width:380px) {
    .card { padding:32px 20px 24px; }
    h1 { font-size:24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition:none; }
  }
</style>
